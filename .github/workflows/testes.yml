# Roda os testes a cada push na main e em todo pull request, no Linux e no
# Windows. No Windows entram o que não dá para testar numa máquina Linux: a
# compilação com o linker da Microsoft, os goldens no sistema de arquivos do
# Windows e a janela fechada no meio de uma conversão (S-2). Os testes rodam
# em debug e em release, porque os goldens têm de bater nos dois.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

# A versão do Rust fica fixa: cada versão nova pode trazer avisos novos do
# clippy e deixar o CI vermelho sem o código ter mudado. Para atualizar,
# troque aqui e corrija o que o clippy novo apontar.
env:
  RUST: "1.98.0"

jobs:
  testes:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Linux
            os: ubuntu-latest
          - nome: Windows
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Rust ${{ env.RUST }}
        run: |
          rustup toolchain install ${{ env.RUST }} --profile minimal --component clippy,rustfmt
          rustup default ${{ env.RUST }}
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (debug)
        run: cargo test --no-fail-fast
      - name: Testes (release)
        run: cargo test --release --no-fail-fast
